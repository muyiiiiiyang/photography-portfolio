name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 物理剥离：管理后台、本地 API 与相关服务端代码不进入公网构建。
      - name: Strip local studio
        run: |
          rm -rf src/app/admin
          rm -rf src/app/api
          rm -rf src/lib/admin
          rm -f src/middleware.ts src/proxy.ts

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      # 清掉 dev/typegen 缓存，避免静态导出时引用已删除的 admin 路由类型。
      - name: Clean Next cache
        run: rm -rf .next

      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify no admin artifacts
        run: |
          if [ -d out/admin ] || [ -d out/api ]; then
            echo "::error::Admin artifacts leaked into the static export"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
